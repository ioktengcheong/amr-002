<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMR Autonomous Dispatcher (Spy Mode)</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 min-h-screen flex items-center justify-center">

  <div class="max-w-md w-full bg-white p-6 rounded-2xl shadow-md space-y-4">
    <h1 class="text-lg font-black text-gray-950 border-b pb-2">AMR 全自動物流發車與背景監控</h1>
    
    <div>
      <label class="text-xs font-bold text-gray-600">目標部門 (Destination)</label>
      <select id="targetDept" class="w-full p-3 border rounded-xl mt-1 text-sm">
        <option value="RC Cafe">RC Cafe</option>
        <option value="Staff Canteen">Staff Canteen</option>
        <option value="Housekeeping">Housekeeping</option>
      </select>
    </div>

    <div>
      <label class="text-xs font-bold text-gray-600">貨品 / 溫層 (Goods Type)</label>
      <select id="goodsType" class="w-full p-3 border rounded-xl mt-1 text-sm">
        <option value="Chilled (冷藏貨)">Chilled (冷藏貨)</option>
        <option value="Frozen (冷凍貨)">Frozen (冷凍貨)</option>
        <option value="Ambient (常溫貨)">Ambient (常溫貨)</option>
      </select>
    </div>

    <button onclick="dispatchMission()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-xl shadow">
      🚀 啟動任務 (自動化 Spy 監控啟動)
    </button>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://amr-logistics-system-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const TELEGRAM_BOT_TOKEN = "9157691891:AAEAKmuToYTM1xu6K4ZNn7KbW6X7AFXql4g";
    const CHAT_ID = "-5376156300";

    function dispatchMission() {
      const dept = document.getElementById('targetDept').value;
      const goods = document.getElementById('goodsType').value;
      const missionId = "MS-" + Math.floor(1000 + Math.random() * 9000);
      const timestamp = Date.now();

      // 1. 寫入 Firebase (Control Tower 及背景 Spy 共同監視的來源)
      db.ref('amr_missions/' + missionId).set({
        amr: "AMR-01",
        targetBu: dept,
        goodsType: goods,
        status: 'ARRIVED',
        timestamp: timestamp
      });

      // 同步本地廣播 (兼容你分享的 Control Tower)
      localStorage.setItem('amr_event_broadcast', JSON.stringify({
        amr: "AMR-01", targetBu: dept, goodsType: goods, status: 'ARRIVED', timestamp: timestamp
      }));

      // 2. 發送 Telegram 到貨通知（帶有真按鈕 Callback）
      const text = `🚨 <b>【AMR 到貨提醒】</b>\n\n📍 <b>目標部門:</b> ${dept}\n📦 <b>任務編號:</b> ${missionId}\n🧊 <b>類別:</b> ${goods}\n\n請點擊下方按鈕進行反饋：`;
      const replyMarkup = {
        inline_keyboard: [[
          { text: "✅ 確認已取貨", callback_data: `confirm_${missionId}` },
          { text: "❌ 貨物不滿意退貨", callback_data: `return_${missionId}` }
        ]]
      };

      fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: "HTML", reply_markup: replyMarkup })
      })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          alert(`任務 ${missionId} 發送成功！背景 Spy 自動監控與超時催促已啟動。`);
          
          // 3. 啟動「背景 Spy 隱形監控與自動重試迴圈」
          startBackgroundSpyLoop(missionId, dept);
        }
      });
    }

    /**
     * 背景 Spy 自動化監控：
     * 自動在背景「靜靜望住」Firebase，若夠鐘無人確認，自動發 Telegram 轟炸；
     * 一旦有人在 Telegram 撳了掣（狀態變 CONFIRMED / RETURNED），Spy 自動收手解除警告。
     */
    function startBackgroundSpyLoop(missionId, dept) {
      let retryCount = 0;
      const maxRetries = 3; // 最多自動催促 3 次

      const spyInterval = setInterval(() => {
        // 背景讀取該任務最新狀態
        db.ref('amr_missions/' + missionId).once('value', (snapshot) => {
          const val = snapshot.val();

          // 情況 A：如果任務不存在，或者已經被領取/退貨 (CONFIRMED / RETURNED)
          if (!val || val.status === 'CONFIRMED' || val.status === 'RETURNED') {
            clearInterval(spyInterval);
            console.log(`[Spy] 任務 ${missionId} 已獲處理或完成，背景自動監控安全退出。`);
            return;
          }

          // 情況 B：夠鐘仍未有人理，且未超過最大重試次數 ➔ 自動發起 Telegram 催促！
          if (retryCount < maxRetries) {
            retryCount++;
            console.log(`[Spy] 任務 ${missionId} 超時未確認，正在發動第 ${retryCount} 次自動提醒...`);
            
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                chat_id: CHAT_ID,
                text: `⚠️ <b>【Spy 自動化超時警告 #${retryCount}】</b>\n部門 <b>${dept}</b> 尚未確認領取任務 <code>${missionId}</code>，請儘快處理！`,
                parse_mode: "HTML"
              })
            });
          } else {
            // 超過次數，停止背景 Spy
            clearInterval(spyInterval);
          }
        });

      }, 30000); // 測試用 30 秒（實戰生產環境可改為 300000 即 5 分鐘）
    }
  </script>
</body>
</html>
