<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMR Telegram Dispatcher</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 min-h-screen flex items-center justify-center">

  <div class="max-w-md w-full bg-white p-6 rounded-2xl shadow-md space-y-4">
    <h1 class="text-lg font-black text-gray-950 border-b pb-2">AMR 前線發車與 Telegram 通知</h1>
    
    <div>
      <label class="text-xs font-bold text-gray-600">目標部門 (Destination)</label>
      <select id="targetDept" class="w-full p-3 border rounded-xl mt-1 text-sm">
        <option value="RC Cafe">RC Cafe</option>
        <option value="Staff Canteen">Staff Canteen</option>
        <option value="Housekeeping">Housekeeping</option>
      </select>
    </div>

    <div>
      <label class="text-xs font-bold text-gray-600">貨品 / 溫層 (Goods Type)</label>
      <select id="goodsType" class="w-full p-3 border rounded-xl mt-1 text-sm">
        <option value="Chilled (冷藏貨)">Chilled (冷藏貨)</option>
        <option value="Frozen (冷凍貨)">Frozen (冷凍貨)</option>
        <option value="Ambient (常溫貨)">Ambient (常溫貨)</option>
      </select>
    </div>

    <button onclick="dispatchMission()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-xl shadow">
      🚀 啟動派送並發送 Telegram 提醒
    </button>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://amr-logistics-system-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const TELEGRAM_BOT_TOKEN = "9157691891:AAEAKmuToYTM1xu6K4ZNn7KbW6X7AFXql4g";
    const CHAT_ID = "-5376156300";
    let activeReminder = null;

    function dispatchMission() {
      const dept = document.getElementById('targetDept').value;
      const goods = document.getElementById('goodsType').value;
      const missionId = "MS-" + Math.floor(1000 + Math.random() * 9000);
      const timestamp = Date.now();

      // 1. 同步寫入 Firebase (供 Control Tower 實時監控)
      db.ref('amr_missions/' + missionId).set({
        amr: "AMR-01",
        targetBu: dept,
        goodsType: goods,
        status: 'ARRIVED',
        timestamp: timestamp
      });

      // 同步廣播事件 (配合你原有的 Broadcast 邏輯)
      localStorage.setItem('amr_event_broadcast', JSON.stringify({
        amr: "AMR-01", targetBu: dept, goodsType: goods, status: 'ARRIVED', timestamp: timestamp
      }));

      // 2. 發送 Telegram 訊息（附帶真按鈕 Callback）
      const text = `🚨 <b>【AMR 到貨提醒】</b>\n\n📍 <b>目標部門:</b> ${dept}\n📦 <b>任務編號:</b> ${missionId}\n🧊 <b>類別:</b> ${goods}\n\n請點擊下方按鈕進行反饋：`;
      const replyMarkup = {
        inline_keyboard: [[
          { text: "✅ 確認已取貨", callback_data: `confirm_${missionId}` },
          { text: "❌ 貨物不滿意退貨", callback_data: `return_${missionId}` }
        ]]
      };

      fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: "HTML", reply_markup: replyMarkup })
      })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          alert(`任務 ${missionId} 已成功發送！`);
          startAutoReminder(missionId, dept);
        }
      });
    }

    // 自動超時重試機制：若未獲確認，定時重複提示
    function startAutoReminder(missionId, dept) {
      if (activeReminder) clearInterval(activeReminder);
      let count = 0;

      activeReminder = setInterval(() => {
        count++;
        db.ref('amr_missions/' + missionId).once('value', (snapshot) => {
          const val = snapshot.val();
          // 如果狀態已經變成 CONFIRMED 或 RETURNED，立即取消不停提示！
          if (!val || val.status === 'CONFIRMED' || val.status === 'RETURNED') {
            clearInterval(activeReminder);
            console.log("任務已獲處理，自動取消超時提示。");
            return;
          }

          if (count <= 3) {
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                chat_id: CHAT_ID,
                text: `⚠️ <b>【超時未取貨提醒 #${count}】</b>\n部門 ${dept} 尚未確認領取任務 ${missionId}，請儘快處理！`,
                parse_mode: "HTML"
              })
            });
          } else {
            clearInterval(activeReminder);
          }
        });
      }, 30000); // 測試用 30 秒，實戰可改為 5 分鐘 (300000)
    }
  </script>
</body>
</html>
