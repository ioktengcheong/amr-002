<!DOCTYPE html>  
<html lang="zh-Hant">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>Warehouse Control Tower App - Smart Logistics</title>  
  <script src="https://cdn.tailwindcss.com"></script>  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>.touch-btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }</style>  
</head>  
<body class="bg-gray-100 min-h-screen p-4 text-gray-800">  
  
  <div class="max-w-2xl mx-auto space-y-4">  
    <!-- Header -->  
    <div class="bg-gray-900 text-white p-5 rounded-2xl shadow-md flex justify-between items-center">  
      <div>  
        <h1 class="text-xl font-black">Warehouse Control Tower</h1>  
        <p class="text-xs text-gray-400">專用：倉務全局車隊、Escalation 與 Spy 狀態監控</p>  
      </div>  
      <i class="fa-solid fa-tower-observation text-2xl text-blue-400"></i>  
    </div>  
  
    <!-- Global KPIs -->  
    <div class="grid grid-cols-3 gap-3 text-center">  
      <div class="bg-white p-4 rounded-xl border shadow-sm">  
        <div class="text-xs text-gray-500 font-bold">活躍派送 (Active)</div>  
        <div class="text-xl font-black text-blue-600 mt-1" id="kpiActive">0</div>  
      </div>  
      <div class="bg-white p-4 rounded-xl border shadow-sm">  
        <div class="text-xs text-gray-500 font-bold">已確認收貨</div>  
        <div class="text-xl font-black text-emerald-600 mt-1" id="kpiConfirmed">0</div>  
      </div>  
      <div class="bg-white p-4 rounded-xl border shadow-sm">  
        <div class="text-xs text-gray-500 font-bold">異常 / 阻擋</div>  
        <div class="text-xl font-black text-rose-600 mt-1" id="kpiFailures">0</div>  
      </div>  
    </div>  

    <!-- Control Tower 異常控制面板 -->
    <div class="bg-white p-5 rounded-2xl border space-y-3 shadow-sm">
      <h2 class="text-xs font-bold text-gray-700 uppercase tracking-wider border-b pb-2">
        <i class="fa-solid fa-triangle-exclamation text-rose-600"></i> AMR 突發狀況與異常廣播
      </h2>
      <div class="flex gap-2">
        <input type="text" id="exceptionMissionId" placeholder="輸入任務編號 (例如 MS-4394)" class="flex-1 p-3 border rounded-xl text-xs">
        <button onclick="broadcastException('BLOCKED', '路障阻擋 / 需人工介入')" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-4 py-3 rounded-xl text-xs shadow">
          🚨 標記受阻
        </button>
        <button onclick="broadcastException('FAILED_5MIN', '運送異常 / 任務失敗')" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-4 py-3 rounded-xl text-xs shadow">
          ⚠️ 標記失敗
        </button>
      </div>
    </div>
  
    <!-- Live Event Feed -->  
    <div class="bg-white p-5 rounded-2xl border space-y-3 shadow-sm">  
      <h2 class="text-xs font-bold text-gray-700 uppercase tracking-wider border-b pb-2">  
        <i class="fa-solid fa-list-check text-blue-600"></i> 全局實時任務動態 (Cloud Real-time Audit Log)  
      </h2>  
      <div id="logContainer" class="space-y-2">  
        <div class="text-center py-6 text-xs text-gray-400">正在連接雲端資料庫載入數據...</div>  
      </div>  
    </div>  
  </div>  
  
  <script>  
    // Firebase 設定
    const firebaseConfig = {
      databaseURL: "https://amr-logistics-system-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const TELEGRAM_BOT_TOKEN = "9157691891:AAEAKmuToYTM1xu6K4ZNn7KbW6X7AFXql4g";
    const CHAT_ID = "-5376156300";

    let activeTasks = {};  
  
    window.onload = function() {  
      // 實時監聽雲端 Firebase 數據變化
      db.ref('amr_missions').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          activeTasks = data;
          renderDashboard();
        } else {
          activeTasks = {};
          renderDashboard();
        }
      });
    };  

    // 管理層發起異常廣播並即時推播至 Telegram
    function broadcastException(statusType, description) {
      const missionId = document.getElementById('exceptionMissionId').value.trim();
      if (!missionId) {
        alert("請先輸入對應的任務編號！");
        return;
      }

      const timestamp = Date.now();
      
      // 更新 Firebase 狀態
      db.ref('amr_missions/' + missionId).update({
        status: statusType,
        errorNote: description,
        timestamp: timestamp
      });

      // 發送緊急 Telegram 警報
      const alertText = `🚨 <b>【Control Tower 異常警報】</b>\n\n` +
                        `📦 <b>任務編號:</b> ${missionId}\n` +
                        `⚠️ <b>狀況描述:</b> ${description}\n` +
                        `⏰ <b>發生時間:</b> ${new Date().toLocaleTimeString()}\n\n` +
                        `<i>請現場維護人員即時處理！</i>`;

      fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: CHAT_ID, text: alertText, parse_mode: "HTML" })
      })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          alert(`已成功發送任務 ${missionId} 的異常警報到 Telegram！`);
          document.getElementById('exceptionMissionId').value = '';
        }
      });
    }
  
    function renderDashboard() {  
      const keys = Object.keys(activeTasks);  
      let activeCount = 0;
      let confirmedCount = 0;
      let failureCount = 0;

      keys.forEach(k => {
        const item = activeTasks[k];
        if (item.status === 'ARRIVED') activeCount++;
        if (item.status === 'CONFIRMED') confirmedCount++;
        if (item.status === 'FAILED_5MIN' || item.status === 'BLOCKED') failureCount++;
      });

      document.getElementById('kpiActive').innerText = activeCount;  
      document.getElementById('kpiConfirmed').innerText = confirmedCount;  
      document.getElementById('kpiFailures').innerText = failureCount;  
  
      const container = document.getElementById('logContainer');  
      if (keys.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-xs text-gray-400">目前沒有活躍任務</div>';
        return;
      }

      container.innerHTML = keys.map(k => {  
        const item = activeTasks[k];  
        let statusBg = 'bg-blue-100 text-blue-800';
        if (item.status === 'ARRIVED') statusBg = 'bg-amber-100 text-amber-800';
        if (item.status === 'CONFIRMED') statusBg = 'bg-emerald-100 text-emerald-800';
        if (item.status === 'FAILED_5MIN' || item.status === 'BLOCKED') statusBg = 'bg-rose-600 text-white';

        return `  
          <div class="p-3 rounded-xl border flex justify-between items-center text-xs ${item.status === 'FAILED_5MIN' || item.status === 'BLOCKED' ? 'bg-rose-50 border-rose-200' : 'bg-gray-50'}">  
            <div>  
              <div class="font-bold text-gray-950">${item.amr || 'AMR-01'} ➔ ${item.targetBu || '未知部門'} (${item.goodsType || 'Normal'}) [${k}]</div>  
              <div class="text-[10px] text-gray-500">時間: ${new Date(item.timestamp).toLocaleTimeString()} ${item.errorNote ? ' | 備註: ' + item.errorNote : ''}</div>  
            </div>  
            <span class="font-mono font-bold px-2.5 py-1 rounded text-xs ${statusBg}">  
              ${item.status}  
            </span>  
          </div>  
        `;  
      }).reverse().join('');  
    }  
  </script>  
</body>  
</html>
